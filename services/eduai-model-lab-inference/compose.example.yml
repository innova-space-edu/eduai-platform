services:
  nano-lite-inference:
    build: .
    container_name: eduai-model-lab-inference
    restart: unless-stopped
    environment:
      EDUAI_MODEL_LAB_TOKEN: ${EDUAI_MODEL_LAB_TOKEN:?Set a high entropy private token}
      EDUAI_MODEL_LAB_MODELS_DIR: /models
      EDUAI_MODEL_LAB_R5_APPROVED: "false"
      HF_HOME: /cache/huggingface
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:8122:8000"
    volumes:
      - /srv/eduai-model-lab/models:/models:ro
      - /srv/eduai-model-lab/cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    cpus: 4.0
    mem_limit: 12g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
