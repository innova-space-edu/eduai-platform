name: Hardening de fuente TypeScript

on:
  push:
    branches:
      - feat/eduai-core-reuse-ai-gateway
    paths:
      - ".github/workflows/source-and-unused-deps-hardening.yml"
      - "scripts/apply-planner-maintenance.mjs"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      GEMINI_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder
      OPENROUTER_API_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      EDUAI_CREDENTIALS_MASTER_KEY: ci-placeholder-master-key-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar baseline
        run: |
          node scripts/normalize-npm-lockfile.mjs
          npm install --registry=https://registry.npmjs.org/ --ignore-scripts

      - name: Materializar fixes TypeScript y estabilizar generadores
        run: |
          node <<'NODE'
          const fs = require('fs')

          function patchFile(path, replacements) {
            let source = fs.readFileSync(path, 'utf8')
            const original = source
            for (const { from, to, label } of replacements) {
              if (source.includes(to)) continue
              if (!source.includes(from)) throw new Error(`Falta patrón para ${label} en ${path}`)
              source = source.replace(from, to)
            }
            if (source !== original) fs.writeFileSync(path, source)
          }

          patchFile('components/creator-hub/comics/ComicsCreatorStudio.tsx', [
            {
              label: 'nextCharacters tipado',
              from: '    const nextCharacters = generatedCharacters.map((generated: any, index: number) => {',
              to: '    const nextCharacters: Character[] = generatedCharacters.map((generated: any, index: number) => {',
            },
            {
              label: 'safeCharacters tipado',
              from: '    const safeCharacters = nextCharacters.length ? nextCharacters : characters',
              to: '    const safeCharacters: Character[] = nextCharacters.length ? nextCharacters : characters',
            },
          ])

          patchFile('scripts/apply-comics-runtime-fixes.mjs', [
            {
              label: 'safeCharacters en generador de Comics',
              from: `replace(\n  "const nextCharacters = generatedCharacters.map((generated: any, index: number) => {",\n  "const nextCharacters: Character[] = generatedCharacters.map((generated: any, index: number) => {",\n)`,
              to: `replace(\n  "const nextCharacters = generatedCharacters.map((generated: any, index: number) => {",\n  "const nextCharacters: Character[] = generatedCharacters.map((generated: any, index: number) => {",\n)\nreplace(\n  "const safeCharacters = nextCharacters.length ? nextCharacters : characters",\n  "const safeCharacters: Character[] = nextCharacters.length ? nextCharacters : characters",\n)`,
            },
          ])

          patchFile('lib/notebook/ingestion-v2.ts', [
            {
              label: 'selector raíz Cheerio',
              from: `    let root = $("body")\n    for (const selector of selectors) {\n      const candidate = $(selector).first()\n      if (candidate.length && candidate.text().trim().length > 300) {\n        root = candidate\n        break\n      }\n    }\n\n    const blocks: string[] = []\n    root.find("h1,h2,h3,h4,p,li,blockquote,pre,figcaption").each((_, element) => {\n      const tag = element.tagName?.toLowerCase() || ""`,
              to: `    let rootSelector = "body"\n    for (const selector of selectors) {\n      const candidate = $(selector).first()\n      if (candidate.length && candidate.text().trim().length > 300) {\n        rootSelector = selector\n        break\n      }\n    }\n\n    const root = $(rootSelector).first()\n    const blocks: string[] = []\n    root.find("h1,h2,h3,h4,p,li,blockquote,pre,figcaption").each((_, element) => {\n      const tag = ((element as { tagName?: string }).tagName || "").toLowerCase()`,
            },
          ])

          patchFile('app/educador/vista-previa/page.tsx', [
            {
              label: 'current estrechado antes de buscar página al copiar',
              from: `    const current = documentRef.current\n    const page = current?.pages.find((item) => item.id === current.activePageId)\n    const ids = new Set(selectedRef.current)\n    if (!page || !ids.size) return`,
              to: `    const current = documentRef.current\n    if (!current) return\n    const page = current.pages.find((item) => item.id === current.activePageId)\n    const ids = new Set(selectedRef.current)\n    if (!page || !ids.size) return`,
            },
          ])

          const whiteboardPath = 'components/whiteboard/WhiteboardMathStudio.tsx'
          let whiteboard = fs.readFileSync(whiteboardPath, 'utf8')
          const whiteboardFixed = whiteboard.replaceAll(' xmlns="http://www.w3.org/1999/xhtml"', '')
          if (whiteboardFixed === whiteboard && !whiteboard.includes('xmlns="http://www.w3.org/1999/xhtml"')) {
            console.log('Whiteboard fuente ya no contiene xmlns HTML inválido')
          } else {
            fs.writeFileSync(whiteboardPath, whiteboardFixed)
          }

          patchFile('scripts/apply-whiteboard-finalization.mjs', [
            {
              label: 'normalización xmlns del generador Whiteboard',
              from: `  if (existsSync(layoutFoldersUpgradePath)) {\n    digitalWhiteboard = loadUpgrade(layoutFoldersUpgradePath, "applyWhiteboardLayoutFoldersUpgrade")(digitalWhiteboard);\n  }\n\n  writeFileSync(digitalWhiteboardPath, digitalWhiteboard);`,
              to: `  if (existsSync(layoutFoldersUpgradePath)) {\n    digitalWhiteboard = loadUpgrade(layoutFoldersUpgradePath, "applyWhiteboardLayoutFoldersUpgrade")(digitalWhiteboard);\n  }\n\n  digitalWhiteboard = digitalWhiteboard.replaceAll(' xmlns="http://www.w3.org/1999/xhtml"', "");\n  writeFileSync(digitalWhiteboardPath, digitalWhiteboard);`,
            },
          ])
          NODE

      - name: Reinstalar desde lock exacto
        run: npm ci --ignore-scripts

      - name: TypeScript sobre checkout materializado
        run: npx tsc --noEmit --pretty false

      - name: Validar que los generadores no reintroducen errores
        run: |
          npm run planner:maintain
          npm run whiteboard:finalize
          node scripts/apply-comics-runtime-fixes.mjs
          node scripts/apply-notebook-ingestion-fix.mjs
          npm run test:whiteboard
          npx tsc --noEmit --pretty false

      - name: Auditoría de producción informativa
        run: |
          npm audit --omit=dev --json > npm-audit-source-hardening.json || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("npm-audit-source-hardening.json","utf8")); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));'

      - name: Build completo
        run: npm run build

      - name: Publicar fuente y generadores validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/creator-hub/comics/ComicsCreatorStudio.tsx \
            scripts/apply-comics-runtime-fixes.mjs \
            lib/notebook/ingestion-v2.ts \
            app/educador/vista-previa/page.tsx \
            components/whiteboard/WhiteboardMathStudio.tsx \
            scripts/apply-whiteboard-finalization.mjs
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar"
            exit 0
          fi
          git commit -m "fix: materializar correcciones TypeScript en fuente"
          git push origin HEAD:feat/eduai-core-reuse-ai-gateway
