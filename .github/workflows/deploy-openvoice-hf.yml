name: Deploy EduAI OpenVoice to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - "services/openvoice-space/**"
      - ".github/workflows/deploy-openvoice-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update private ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: EsthefanoMC23/eduai-openvoice-private
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          repo_id = os.environ["HF_SPACE_REPO"]
          if not token:
              raise RuntimeError("El secreto HF_TOKEN no está configurado en GitHub Actions")

          api = HfApi(token=token)
          identity = api.whoami()
          print(f"Authenticated in Hugging Face as: {identity.get('name', 'unknown')}")

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              space_hardware="zero-a10g",
              private=True,
              exist_ok=True,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="services/openvoice-space",
              commit_message="Deploy EduAI OpenVoice V2",
          )

          runtime = api.request_space_hardware(
              repo_id=repo_id,
              hardware="zero-a10g",
          )
          requested = getattr(runtime, "requested_hardware", None)
          active = getattr(runtime, "hardware", None)
          print(f"ZeroGPU requested: {requested or active or 'zero-a10g'}")
          print(f"Deployed https://huggingface.co/spaces/{repo_id}")
          PY
