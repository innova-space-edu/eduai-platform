name: Refresh seguro de dependencias

on:
  push:
    branches:
      - feat/eduai-core-reuse-ai-gateway
    paths:
      - ".github/workflows/security-dependency-refresh.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      GEMINI_API_KEY: ci-placeholder
      GROQ_API_KEY: ci-placeholder
      OPENROUTER_API_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      EDUAI_CREDENTIALS_MASTER_KEY: ci-placeholder-master-key-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar baseline
        run: |
          node scripts/normalize-npm-lockfile.mjs
          npm install --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Actualizar dependencias directas con fixes conocidos
        run: |
          npm install --save-exact next@16.3.1 mermaid@11.16.1 xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          npm install --save-dev --save-exact eslint-config-next@16.3.1
      - name: Aplicar solo fixes audit no disruptivos
        run: npm audit fix --omit=dev --package-lock-only || true
      - name: Auditar resultado
        run: |
          npm audit --omit=dev --json > npm-audit-after.json || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("npm-audit-after.json","utf8")); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));'
      - name: Build completo
        run: npm run build
      - name: Empaquetar archivos candidatos
        uses: actions/upload-artifact@v4
        with:
          name: security-dependency-refresh
          path: |
            package.json
            package-lock.json
            npm-audit-after.json
          if-no-files-found: error
