name: Temporary security dependency lockfile refresh
on:
  push:
    branches:
      - security/fix-npm-audit-2026-11

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile lockfile without installing scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --registry=https://registry.npmjs.org
      - name: Verify no affected production packages
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs')
          const data = JSON.parse(fs.readFileSync('npm-audit-production.json','utf8'))
          console.log('Production audit totals:',data.metadata?.vulnerabilities)
          if ((data.metadata?.vulnerabilities?.total || 0) !== 0) {
            console.log('Remaining:',Object.keys(data.vulnerabilities || {}))
            process.exit(1)
          }
          NODE
      - name: Commit the resolved lockfile to the same temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Already synchronized"
          else
            git commit -m "chore(security): lock audited patched dependency tree"
            git push origin "HEAD:security/fix-npm-audit-2026-11"
          fi
