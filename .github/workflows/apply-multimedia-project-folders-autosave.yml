name: Apply Multimedia Project Folders Autosave

on:
  push:
    branches:
      - feat/multimedia-project-folders-autosave
    paths:
      - scripts/apply-multimedia-project-folders-autosave.py
      - .github/workflows/apply-multimedia-project-folders-autosave.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/multimedia-project-folders-autosave
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source migration
        run: python3 scripts/apply-multimedia-project-folders-autosave.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Multimedia folders regression
        run: node scripts/test-multimedia-project-folders.mjs

      - name: Commit intended multimedia source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/multimedia/MultimediaStudioV3Client.tsx lib/multimedia/project-store.ts scripts/test-multimedia-project-folders.mjs package.json
          git commit -m "feat: carpetas y autoguardado de proyectos multimedia [generated]"

      - name: Production build
        run: npm run build

      - name: Discard build-time source mutations
        run: git reset --hard HEAD

      - name: Remove one-time migration files
        run: |
          rm -f scripts/apply-multimedia-project-folders-autosave.py
          rm -f .github/workflows/apply-multimedia-project-folders-autosave.yml
          git add -A
          git commit -m "chore: limpiar migración temporal multimedia"

      - name: Push clean branch
        run: git push origin HEAD:feat/multimedia-project-folders-autosave
