name: Supabase production read-only gate

on:
  push:
    branches:
      - feat/eduai-core-reuse-ai-gateway
    paths:
      - ".github/workflows/supabase-readonly-gate.yml"

permissions:
  contents: read

jobs:
  verify-production-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: jfytmdvcqrjbbtyuklyf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secretos sin exponerlos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          echo "Secrets requeridos presentes"

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Descubrir comandos disponibles
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase link --help > supabase-link-help.log
          supabase migration list --help > supabase-migration-list-help.log
          supabase db lint --help > supabase-db-lint-help.log

      - name: Enlazar proyecto de producción sin aplicar cambios
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Listar migraciones locales y remotas
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee supabase-migration-list.log

      - name: Ejecutar lint de base en modo lectura si está soportado
        shell: bash
        run: |
          set -u
          if grep -q -- "--linked" supabase-db-lint-help.log; then
            supabase db lint --linked --level warning 2>&1 | tee supabase-db-lint.log
            exit 0
          fi
          echo "La versión instalada no expone --linked para db lint" | tee supabase-db-lint.log

      - name: Publicar evidencia de solo lectura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-readonly-gate
          path: |
            supabase-*-help.log
            supabase-migration-list.log
            supabase-db-lint.log
          if-no-files-found: warn
          retention-days: 7
