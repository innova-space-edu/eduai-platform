name: CI

on:
  push:
    branches: [main]

  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Guardian email validation regression
        run: node scripts/test-guardian-email-validation.mjs 'app/(auth)/register/page.tsx' lib/family-consent/server.ts

      - name: Normalize lockfile registry
        run: node scripts/normalize-npm-lockfile.mjs

      - name: Verify public npm registry
        run: |
          node -e "const fs=require('fs'); const lock=fs.readFileSync('package-lock.json','utf8'); if(lock.includes('packages.applied-caas-gateway1.internal.api.openai.org')) throw new Error('El lockfile aún contiene URLs privadas'); console.log('Public npm registry verified')"

      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/

      - name: Estadísticas y aprobación institucional
        run: node scripts/test-family-admin-stats.mjs lib/family-consent/admin-stats.ts app/api/family-consent/admin/route.ts app/admin/autorizaciones-familiares/page.tsx

      - name: Exportación consolidada Excel y PDF
        run: npx tsx scripts/test-admin-consolidated-exports.ts

      - name: Actas familiares y consentimiento una sola vez
        run: node scripts/test-eduai-actas-consent-once.mjs

      - name: Family authorization regression
        run: node scripts/test-family-enforcement.mjs lib/family-consent/transition.ts proxy.ts app/autorizacion-pendiente/page.tsx

      - name: Apply provider client lazy initialization
        run: node scripts/apply-provider-client-initialization.mjs

      - name: Verify provider client initialization
        run: node scripts/test-provider-client-initialization.mjs

      - name: Apply planner maintenance
        run: npm run planner:maintain

      - name: Apply whiteboard normalization
        run: npm run whiteboard:finalize

      - name: Verify planner maintenance
        run: |
          node -e "const fs=require('fs'); const route=fs.readFileSync('app/api/agents/educador/route.ts','utf8'); if(route.includes('explicación del problema ambiental')) throw new Error('La rúbrica ambiental fija sigue presente'); for(const file of ['fix-exam-generate.diff','fix-exam-create-page.diff']) if(fs.existsSync(file)) throw new Error('Parche temporal aún presente: '+file); console.log('Planner maintenance verified')"

      - name: Whiteboard integrity
        run: npm run test:whiteboard

      - name: Voice replication access and no-HF regression
        run: node scripts/test-admin-voice-replication.mjs

      - name: Voice same-origin CORS relay regression
        run: npx tsx scripts/test-voice-cors-proxy.ts

      - name: Kaggle and Colab GPU voice bridge regression
        run: node scripts/test-voice-gpu-bridge.mjs

      - name: Manual Kaggle voice regression
        run: node scripts/test-kaggle-manual-voice.mjs

      - name: Secure Kaggle ZIP/WAV regression
        run: npx tsx scripts/test-kaggle-zip.ts

      - name: Offline Chatterbox private GPU contract
        run: |
          python -m py_compile services/eduai-voice-chatterbox/main.py
          python -m py_compile services/eduai-voice-chatterbox/test_main.py
          node scripts/test-chatterbox-cloud-run.mjs

      - name: Audio Google gateway integrity
        run: |
          python -m py_compile services/google-audio-gateway/*.py
          test ! -e lib/audio/gradio-song-engine.ts
          test ! -e lib/audio/gradio-openvoice-engine.ts
          test ! -e services/ace-step-song-space/app.py
          test ! -e services/openvoice-space/app.py
          grep -q "lyria-3.5" services/google-audio-gateway/song_gateway.py
          grep -q "gemini-3.8-flash-tts" services/google-audio-gateway/voice_gateway.py

      - name: QR Studio collection tests
        run: npx tsx scripts/test-qr-collections.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: EDUAI Music YouTube learning
        run: npx tsx scripts/test-mix-favorite-learning.ts

      - name: EDUAI Audio Lab Gemini TTS regression
        run: npx tsx scripts/test-gemini-narration.ts

      - name: Brain AI shadow routing
        run: npx tsx scripts/test-brain-ai.ts

      - name: Focused lint
        run: npx eslint proxy.ts lib/planning-quality-audit.ts lib/school-planning-profiles.ts lib/planner-oa-bridge.ts scripts/test-planner-integral.ts app/api/agents/educador/route.ts app/api/agents/educador/curriculum/route.ts app/educador/page.tsx

      - name: Planner tests
        run: npm run test:planner

      - name: Build
        run: npm run build
