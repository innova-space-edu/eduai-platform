name: Apply Multimedia Audio V4

on:
  push:
    branches:
      - feat/multimedia-audio-v4

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[multimedia-v4-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/multimedia-audio-v4
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply V4 source migration
        run: node scripts/apply-multimedia-audio-v4-source.mjs

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate V4 source
        run: node scripts/test-multimedia-audio-v4.mjs

      - name: Remove one-time migration files
        run: |
          git rm -f scripts/apply-multimedia-timeline-enhancements.mjs
          git rm -f scripts/apply-multimedia-audacity-waveform.mjs
          git rm -f lib/multimedia/waveform.ts
          git rm -f scripts/apply-multimedia-audio-v4-source.mjs
          git rm -f .github/workflows/apply-multimedia-audio-v4.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materializar audio engine V4 [multimedia-v4-generated]"
          git push origin HEAD:feat/multimedia-audio-v4
