name: Apply Multimedia Projects MP3 Extract

on:
  push:
    branches:
      - feat/multimedia-projects-mp3-extract-audio

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[multimedia-projects-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/multimedia-projects-mp3-extract-audio
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Apply source migration
        run: node scripts/apply-multimedia-projects-mp3-extract.mjs

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Multimedia V4 regression test
        run: node scripts/test-multimedia-audio-v4.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-multimedia-projects-mp3-extract.mjs
          rm .github/workflows/apply-multimedia-projects-mp3-extract.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/multimedia/MultimediaStudioV3Client.tsx lib/multimedia/project-store.ts lib/multimedia/media-convert.ts package.json package-lock.json scripts/apply-multimedia-projects-mp3-extract.mjs .github/workflows/apply-multimedia-projects-mp3-extract.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat: guardar proyectos, exportar MP3 y separar audio [multimedia-projects-generated]"
            git push origin HEAD:feat/multimedia-projects-mp3-extract-audio
          fi
