name: EDUAI Exact Math and R4 (isolated)
on:
  pull_request:
    paths:
      - "lib/math/**"
      - "services/eduai-math-engine/**"
      - "training/eduai-local/math-r4/**"
      - "scripts/test-math-exact.mjs"
      - ".github/workflows/eduai-exact-math-r4.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test bounded TypeScript math engine
        run: node --experimental-strip-types scripts/test-math-exact.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install symbolic engine dependencies
        run: python -m pip install -r services/eduai-math-engine/requirements.txt
      - name: Test SymPy operations and input rejection
        working-directory: services/eduai-math-engine
        run: python -m unittest -v test_solver
      - name: Test R4 dataset, split and single-notebook bundle
        run: python -m unittest discover -s training/eduai-local/math-r4 -p "test_*.py" -v
