name: Materialize Paper Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/materialize-paper-pipeline.yml"

permissions:
  contents: write

concurrency:
  group: materialize-paper-pipeline
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdf-large-hybrid-parser
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and apply current migration
        run: |
          node scripts/normalize-npm-lockfile.mjs
          npm install --registry=https://registry.npmjs.org/
          node scripts/apply-paper-pipeline.mjs

      - name: Replace migration hooks with direct tests
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))

          for (const name of ['dev', 'build']) {
            packageJson.scripts[name] = String(packageJson.scripts[name] || '')
              .replace(/\s*&&\s*node scripts\/apply-paper-pipeline\.mjs/g, '')
          }

          packageJson.scripts.build = packageJson.scripts.build.replace(
            '&& node scripts/test-repository-integrity.mjs',
            '&& node scripts/test-paper-pipeline.mjs && node scripts/test-repository-integrity.mjs',
          )
          packageJson.scripts['test:paper'] = 'node scripts/test-paper-pipeline.mjs'
          delete packageJson.scripts.postinstall

          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n')
          NODE

          rm -f \
            scripts/apply-paper-hybrid-parser.mjs \
            scripts/apply-paper-large-remote.mjs \
            scripts/apply-paper-pipeline.mjs \
            .github/workflows/materialize-paper-pipeline.yml

      - name: Verify materialized pipeline
        run: |
          npm run test:paper
          npm run build

      - name: Reject unrelated generated changes
        run: |
          python <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/materialize-paper-pipeline.yml',
              'app/api/agents/paper/extract/route.ts',
              'app/api/agents/paper/route.ts',
              'app/paper-large/page.tsx',
              'app/paper/page.tsx',
              'lib/papers/extraction.ts',
              'package-lock.json',
              'package.json',
              'scripts/apply-paper-hybrid-parser.mjs',
              'scripts/apply-paper-large-remote.mjs',
              'scripts/apply-paper-pipeline.mjs',
              'scripts/test-paper-pipeline.mjs',
          }

          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1'],
              text=True,
          )
          changed = set()
          for line in output.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Cambios inesperados generados por build:\n' + '\n'.join(unexpected))
          PY

      - name: Commit final source files
        run: |
          git config user.name "Innova Space Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            .github/workflows/materialize-paper-pipeline.yml \
            app/api/agents/paper/extract/route.ts \
            app/api/agents/paper/route.ts \
            app/paper-large/page.tsx \
            app/paper/page.tsx \
            lib/papers/extraction.ts \
            package-lock.json \
            package.json \
            scripts/apply-paper-hybrid-parser.mjs \
            scripts/apply-paper-large-remote.mjs \
            scripts/apply-paper-pipeline.mjs \
            scripts/test-paper-pipeline.mjs

          if git diff --cached --quiet; then
            echo "No hay cambios que materializar."
            exit 0
          fi

          git commit -m "refactor(paper): materialize hybrid PDF pipeline"
          git push origin HEAD:feat/pdf-large-hybrid-parser
