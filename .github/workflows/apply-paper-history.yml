name: Apply Paper History

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/apply-paper-history.yml"
      - "scripts/apply-paper-history.mjs"

permissions:
  contents: write

concurrency:
  group: apply-paper-history
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdf-large-hybrid-parser
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply saved materials panel
        run: node scripts/apply-paper-history.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Paper pipeline
        run: |
          npm run test:paper
          git diff --check

      - name: Remove temporary materializer
        run: |
          rm -f scripts/apply-paper-history.mjs
          rm -f .github/workflows/apply-paper-history.yml

      - name: Commit final implementation
        run: |
          git config user.name "Innova Space Automation"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            app/api/agents/paper/extract/route.ts \
            app/paper/page.tsx \
            components/paper/PaperHistoryPanel.tsx \
            scripts/test-paper-pipeline.mjs \
            scripts/apply-paper-history.mjs \
            .github/workflows/apply-paper-history.yml

          git commit -m "feat(paper): add reusable materials history panel"
          git push origin HEAD:feat/pdf-large-hybrid-parser
