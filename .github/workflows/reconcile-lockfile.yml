name: Reconciliar package-lock

on:
  push:
    branches:
      - feat/eduai-core-reuse-ai-gateway
    paths:
      - ".github/workflows/reconcile-lockfile.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  reconcile-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: feat/eduai-core-reuse-ai-gateway
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerar lockfile con npm real
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-npm-lockfile.mjs
          npm install --package-lock-only --registry=https://registry.npmjs.org/ --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const root = lock.packages?.[''] || {}
          const deps = root.dependencies || {}
          const dev = root.devDependencies || {}
          if (deps['@sparticuz/chromium'] !== '148.0.0') throw new Error('Chromium lock no quedó en 148.0.0')
          if (deps['puppeteer-core'] !== '25.0.4') throw new Error('Puppeteer lock no quedó en 25.0.4')
          if (dev.pptxgenjs !== '^4.0.1') throw new Error('pptxgenjs no quedó como devDependency')
          if (deps.pptxgenjs) throw new Error('pptxgenjs volvió al runtime de producción')
          NODE
      - name: Commit del lockfile si cambió
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya estaba sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lockfile"
          git push origin HEAD:feat/eduai-core-reuse-ai-gateway
