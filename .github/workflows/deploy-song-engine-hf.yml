name: Deploy EduAI Song Engine to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - "services/ace-step-song-space/**"
      - ".github/workflows/deploy-song-engine-hf.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update private ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: EsthefanoMC23/eduai-song-engine
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_REPO"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              private=True,
              exist_ok=True,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="services/ace-step-song-space",
              commit_message="Deploy EduAI Song Engine",
          )

          try:
              runtime = api.request_space_hardware(repo_id=repo_id, hardware="zero-a10g")
              print(f"Requested hardware: {runtime.requested_hardware or runtime.hardware}")
          except Exception as error:
              print(f"ZeroGPU request warning: {error}")
              print("The source was deployed. Select ZeroGPU manually if the account cannot request it through the API.")

          print(f"Deployed https://huggingface.co/spaces/{repo_id}")
          PY
